<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F9F4EF;
    --panel: #FFFFFF;
    --ink: #020826;
    --ink-soft: #716040;
    --teal: #8C7851;
    --teal-dark: #6E5F3F;
    --teal-pale: #EADDCF;
    --lav: #F25042;
    --lav-pale: #FBE4E2;
    --line: #EADDCF;
    --danger: #F25042;
    --danger-pale: #FBE4E2;
    --radius: 16px;
    --avatar-bg: #EFE1CC;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #020826;
    --panel: #10142E;
    --ink: #F9F4EF;
    --ink-soft: #C9BFAE;
    --teal: #C9A876;
    --teal-dark: #8C7851;
    --teal-pale: #2C2415;
    --lav: #F25042;
    --lav-pale: #3A1C1A;
    --line: #23283F;
    --danger: #F25042;
    --danger-pale: #3A1C1A;
    color-scheme: dark;
  }
  body { transition: background 0.2s; }
  .app { transition: background 0.2s, box-shadow 0.2s; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    box-sizing: border-box;
  }
  .app {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    min-height: 600px;
    background: var(--panel);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 2px 24px rgba(53,99,95,0.08);
    display: flex;
    flex-direction: column;
  }
  .header {
    background: var(--teal-dark);
    color: #fff;
    padding: 20px 22px 18px;
    font-family: 'Zen Maru Gothic', sans-serif;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .header h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header p {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .theme-toggle {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .room-btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .room-menu-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 40;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .room-menu-card {
    margin-top: 64px;
    width: min(300px, 88%);
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .room-menu-title {
    padding: 14px 16px 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 15px;
  }
  .room-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 14.5px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    border-top: 1px solid var(--line);
  }
  .room-menu-item:hover { background: var(--teal-pale); }
  .room-menu-item.active {
    color: var(--teal-dark);
    font-weight: 700;
  }
  .profile-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
  }

  /* --- avatar picker --- */
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .avatar-opt {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--avatar-bg);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .avatar-opt.selected {
    border-color: var(--teal);
    box-shadow: 0 0 0 2px var(--avatar-bg);
  }
  .avatar-circle {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--avatar-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .sender-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .role-badge {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 500;
  }
  .role-badge.admin { background: var(--teal); color: #fff; }
  .role-badge.subadmin { background: var(--lav); color: #fff; }

  /* --- long-press context menu --- */
  .ctx-menu {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    overflow: hidden;
    z-index: 50;

  .ctx-menu button {

  .modal-card {

    max-height: 85%;

  }
  .modal-card .setup { padding: 28px 24px; }

  .terms-view-link {
    display: inline-block;
    font-size: 11.5px;
    color: var(--teal);
    text-decoration: underline;

    margin: -4px 0 10px;
    background: none;
    border: none;
    padding: 0;
  }
  .terms-doc {
    text-align: left;
    padding: 24px 22px 32px;
    max-height: 75vh;
    overflow-y: auto;
  }
  .terms-doc-h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 18px;
    color: var(--teal-dark);
    margin: 0 0 16px;

  .terms-doc-h2 {
    font-family: 'Zen Maru Gothic', sans-serif;

  .terms-doc-p { font-size: 13px; line-height: 1.8; color: var(--ink); margin: 0 0 8px; }
  .terms-doc-ul, .terms-doc-ol { margin: 0 0 8px; padding-left: 1.4em; }
  .terms-doc-ul li, .terms-doc-ol li { font-size: 13px; line-height: 1.8; color: var(--ink); margin-bottom: 4px; }
  .terms-doc-note { list-style: none; margin-left: -1.4em; font-size: 12px; color: var(--ink-soft); background: var(--bg); padding: 8px 10px; border-radius: 8px; }
  .terms-doc-hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
  .terms-doc-close {

    top: 0;
    text-align: right;

  .terms-doc-close button {

  .blocked-empty { font-size: 13px; color: var(--ink-soft); }

  .blocked-item button {

    background: var(--teal-pale);

  .setup .icon {

  }
  .setup h2 {

    font-size: 17px;
    margin: 0 0 8px;

    color: var(--ink-soft);

    font-family: 'Zen Maru Gothic', sans-serif;
    cursor: pointer;

  .messages {

    gap: 10px;

  .empty-hint {

    display: flex;
    flex-direction: column;

  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }
  .msg-sender {

    color: var(--ink-soft);

  .hidden-tag {

    border-radius: 8px;

  .bubble {

  .msg-row.other .bubble {

    color: var(--ink);
    border-bottom-left-radius: 4px;

  .msg-row.me .bubble {

  .msg-actions {

    margin-top: 3px;

  .msg-actions button {

    border: none;

    padding: 2px 4px;

  .msg-actions button:hover { color: var(--danger); }

  .composer-wrap {
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  .char-count {
    text-align: right;
    font-size: 10.5px;
    color: var(--ink-soft);
    padding: 4px 16px 0;

    resize: none;

    padding: 10px 13px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    height: 42px;
    line-height: 1.4;

  .composer textarea:focus { border-color: var(--teal); }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--teal);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;

  .send-btn:disabled { opacity: 0.5; cursor: default; }

  .sticker-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--avatar-bg);
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;

  .sticker-panel {
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 10px 14px 0;

  .sticker-panel.open { display: grid; }
  .sticker-opt {
    border: none;
    background: var(--avatar-bg);
    border-radius: 12px;
    padding: 4px;
    cursor: pointer;
  }
  .sticker-opt img { width: 100%; display: block; }
  .sticker-bubble {
    width: 120px;
  }
  .sticker-bubble img {
    width: 100%;
    display: block;
    border-radius: 12px;
  }
  .msg-row.me .sticker-bubble { align-self: flex-end; }

  .footer-links {
    text-align: center;
    padding: 8px 0 14px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .footer-links a {
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
  }

  .toast {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #1c1c26;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    max-width: 88%;
    text-align: center;
    line-height: 1.5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .admin-panel {
    padding: 18px;
    border-top: 1px solid var(--line);
    background: var(--lav-pale);
  }
  .admin-panel h3 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13.5px;
    color: var(--lav);
    margin: 0 0 10px;
  }
  .report-item {
    background: #fff;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    margin-bottom: 6px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .report-item b { color: var(--danger); }

<div class="app" id="app" style="position:relative;">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>道クサ</h1>
        <p id="room-label" style="cursor:pointer;" title="タップして部屋を切り替え"></p>
      </div>
      <div class="header-actions">
        <button class="room-btn" id="room-toggle" aria-label="部屋を切り替え">≡部屋</button>
        <button class="profile-btn" id="profile-toggle" aria-label="プロフィール編集">✎</button>
        <button class="theme-toggle" id="theme-toggle" aria-label="表示モード切り替え">☀</button>
      </div>
    </div>

  <div id="profile-edit-slot"></div>
  <div id="root"></div>
  <div class="toast" id="toast"></div>

<script>
const NG_WORDS = [
  // 死ね・消えろ系
  "死ね","しね","消えろ","きえろ","死んで","殺す","ころす","自殺しろ",
  // 存在否定・強い暴言
  "うざい","うぜえ","きもい","きしょい","気持ち悪い","カス","くず","クズ","ゴミ","ごみ",
  "無能","邪魔","despise","要らない","いらない子","消えて",
  // 容姿・能力への攻撃
  "ぶす","ブス","デブ","のろま","バカ","ばか","あほ","アホ","まぬけ","間抜け",
  // いじめ関連の定型句
  "仲間はずれ","のけ者","裏切り者","嘘つき","うそつき",
  // 差別的表現(一部・随時追加)
  "気違い","きちがい","池沼",
];

// 全角/半角スペース・記号を除去して、間にスペース等を挟んだ回避を検出する
function normalizeForFilter(text) {
  return text.replace(/[\s　.。・-]/g, "");
}

function filterText(text) {
  const normalized = normalizeForFilter(text);
  let hit = false;
  NG_WORDS.forEach(w => {
    if (normalized.includes(w)) hit = true;
  });
  if (!hit) return { text, flagged: false };

  // ヒットした場合は、元の文字列上でも素直に一致する箇所を置き換える(簡易対応)
  let out = text;
  NG_WORDS.forEach(w => {
    out = out.split(w).join("○".repeat(w.length));
  });
  return { text: out, flagged: true };
}

async function loadMessages() {
  try {
    const { data, error } = await sb.from('messages').select('*').eq('room', state.room).order('created_at', { ascending: true }).limit(300);
    if (!error && data) {
      state.messages = data.map(r => ({ id: r.id, sender: r.sender, text: r.text, time: new Date(r.created_at).getTime(), hidden: !!r.hidden, ownerId: r.owner_id, room: r.room }));
      renderMessages();
    }
  } catch (e) {}
}

let realtimeChannel = null;
let profilePollTimer = null;
function startRealtime() {
  stopRealtimeChannel();
  const room = state.room;
  realtimeChannel = sb.channel('messages-channel-' + room)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + room }, (payload) => {
      const r = payload.new;
      if (!state.messages.find(m => m.id === r.id)) {
        state.messages.push({ id: r.id, sender: r.sender, text: r.text, time: new Date(r.created_at).getTime(), hidden: !!r.hidden, ownerId: r.owner_id, room: r.room });
        renderMessages();
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: 'room=eq.' + room }, (payload) => {
      const r = payload.new;
      const m = state.messages.find(m => m.id === r.id);
      if (m) m.hidden = !!r.hidden;
      renderMessages();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'room=eq.' + room }, (payload) => {
      const old = payload.old;
      state.messages = state.messages.filter(m => m.id !== old.id);
      renderMessages();
    })
    .subscribe();

  if (profilePollTimer) return;
  profilePollTimer = setInterval(async () => {
    await refreshProfiles();
    await refreshBanned();
    renderMessages();
  }, 6000);
}

function stopRealtimeChannel() {
  if (realtimeChannel) {
    try { sb.removeChannel(realtimeChannel); } catch (e) {}
    realtimeChannel = null;
  }
}

  applyTheme(theme);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '☾' : '☀';
}

async function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localSet('theme', next);
}

async function init() {
  await initTheme();
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  document.getElementById('room-toggle').addEventListener('click', openRoomMenu);
  document.getElementById('room-label').addEventListener('click', openRoomMenu);

  if (!sb) {

    `;

  const profileRaw = localGet('profile');

  const savedRoom = localGet('room');
  state.room = (savedRoom && ROOMS.some(r => r.id === savedRoom)) ? savedRoom : DEFAULT_ROOM_ID;

  state.profile = profile;

  updateRoomLabel();

    startRealtime();
  }
}

}

  tempTarget.innerHTML = `
    <div class="setup">
      <div class="icon" id="e-preview-icon" style="font-size:26px;">${avatarHtml(current.avatar)}</div>
      <h2>プロフィールを編集</h2>
      <p>ニックネームとアイコンはあとからでも変更できます。</p>
      <input id="e-nick-input" type="text" maxlength="16" value="${escapeHtml(current.nickname)}" />
      <div class="err" id="e-nick-err">ニックネームを入力してください</div>
      <div class="avatar-grid" id="e-avatar-grid">
        ${AVATAR_OPTIONS.map((a,i) => `<button type="button" class="avatar-opt ${a === current.avatar ? 'selected' : ''}" data-avatar-idx="${i}">${avatarHtml(a)}</button>`).join('')}
      </div>
      <button class="btn-main" id="e-nick-submit">保存する</button>
      <button class="btn-main" id="e-cancel" style="background:transparent;color:var(--ink-soft);margin-top:8px;">キャンセル</button>
    </div>
  `;
  let selectedAvatar = current.avatar;
  const input = tempTarget.querySelector('#e-nick-input');
  const err = tempTarget.querySelector('#e-nick-err');
  tempTarget.querySelectorAll('.avatar-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedAvatar = AVATAR_OPTIONS[parseInt(btn.getAttribute('data-avatar-idx'), 10)];
      tempTarget.querySelectorAll('.avatar-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      tempTarget.querySelector('#e-preview-icon').innerHTML = avatarHtml(selectedAvatar);
    });
  });
  input.addEventListener('input', () => { err.style.display = 'none'; });
  tempTarget.querySelector('#e-nick-submit').addEventListener('click', async () => {
    const v = input.value.trim();
    if (!v) { err.style.display = 'block'; return; }
    const role = (current && current.role) || 'member';
    const newProfile = { nickname: v, avatar: selectedAvatar, role };
    state.profile = newProfile;
    localSet('profile', JSON.stringify(newProfile));
    await registerProfile(newProfile);
    document.getElementById('profile-edit-slot').innerHTML = '';
    renderMessages();
    showToast('プロフィールを更新しました');
  });
  tempTarget.querySelector('#e-cancel').addEventListener('click', () => {
    document.getElementById('profile-edit-slot').innerHTML = '';
  });
}

function updateFooterLinks() {
  const el = document.querySelector('.footer-links');
  if (!el) return;
  const canSeeAdmin = state.profile && (state.profile.role === 'admin' || state.profile.role === 'subadmin');
  el.innerHTML = '<a id="footer-terms-link">利用規約</a> ・ <a id="footer-blocked-link">ブロック一覧</a>' + (canSeeAdmin ? ' ・ <a id="admin-toggle">運営スタッフ用</a>' : '');
  document.getElementById('footer-terms-link').addEventListener('click', openTermsModal);
  document.getElementById('footer-blocked-link').addEventListener('click', openBlockedModal);
  const adminToggleEl = document.getElementById('admin-toggle');
  if (adminToggleEl) adminToggleEl.addEventListener('click', toggleAdmin);
}

function avatarFor(name, fallback) {
  const p = state.profiles[name];
  return (p && p.avatar) || fallback || AVATAR_OPTIONS[0];
}

function roleFor(name, fallback) {
  const p = state.profiles[name];
  return (p && p.role) || fallback || 'member';
}

function roleBadgeHtml(role) {
  if (role === 'admin') return '<span class="role-badge admin">管理人</span>';
  if (role === 'subadmin') return '<span class="role-badge subadmin">副管理人</span>';
  return '';
}

function renderMessages() {
  const container = document.getElementById('messages');
  if (!container) return;
  const isStaff = state.profile.role === 'admin' || state.profile.role === 'subadmin';
  const visible = state.messages.filter(m => {
    if (state.blocked.includes(m.sender) || state.banned.includes(m.sender)) return false;
    if (m.hidden && !isStaff && m.sender !== state.profile.nickname) return false;
    return true;
  });
  if (visible.length === 0) {
    container.innerHTML = `<div class="empty-hint">まだメッセージはありません。<br>気軽に「こんにちは」から始めてみてください。</div>`;
    return;
  }
  container.innerHTML = visible.map(m => {
    const mine = m.ownerId === DEVICE_ID;
    const avatar = avatarFor(m.sender, m.avatar);
    const role = roleFor(m.sender, m.role);
    const isSticker = typeof m.text === 'string' && m.text.startsWith(STICKER_PREFIX);
    const stickerIdx = isSticker ? parseInt(m.text.slice(STICKER_PREFIX.length), 10) : -1;
    const stickerSrc = isSticker ? STICKERS[stickerIdx] : null;
    const bubbleHtml = (isSticker && stickerSrc)
      ? `<div class="sticker-bubble" data-bubble="${m.id}"><img src="${stickerSrc}" alt="スタンプ"></div>`
      : `<div class="bubble" data-bubble="${m.id}">${escapeHtml(m.text)}</div>`;
    return `
      <div class="msg-row ${mine ? 'me' : 'other'}" data-sender="${escapeHtml(m.sender)}" data-id="${m.id}">
        ${mine ? '' : `
          <div class="sender-line">
            <span class="avatar-circle">${avatarHtml(avatar)}</span>
            <span class="msg-sender">${escapeHtml(m.sender)}</span>
            ${roleBadgeHtml(role)}
          </div>
        `}
        ${m.hidden ? '<div class="hidden-tag">⚠ 複数の通報により非表示中(運営にのみ表示)</div>' : ''}
        ${bubbleHtml}
        ${mine ? `
          <div class="msg-actions">
            <button data-delete="${m.id}">削除</button>
          </div>
        ` : `
          <div class="msg-actions">
            <button data-block="${escapeHtml(m.sender)}">ブロック</button>
            <button data-report="${m.id}">通報</button>
          </div>
        `}
      </div>
    `;
  }).join('');
  container.scrollTop = container.scrollHeight;

  container.querySelectorAll('[data-block]').forEach(btn => {
    btn.addEventListener('click', () => blockUser(btn.getAttribute('data-block')));
  });
  container.querySelectorAll('[data-report]').forEach(btn => {
    btn.addEventListener('click', () => reportMessage(btn.getAttribute('data-report')));
  });
  container.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => deleteMessage(btn.getAttribute('data-delete')));
  });

  // 長押しでブロック/追放メニュー(相手の発言のみ)
  container.querySelectorAll('.msg-row.other .bubble').forEach(bubble => {
    const row = bubble.closest('.msg-row');
    const sender = row.getAttribute('data-sender');
    const start = (e) => {
      longPressTimer = setTimeout(() => openCtxMenu(e, sender), 550);
    };
    const cancel = () => { if (longPressTimer) clearTimeout(longPressTimer); };
    bubble.addEventListener('mousedown', start);
    bubble.addEventListener('touchstart', start, { passive: true });
    ['mouseup','mouseleave','touchend','touchmove'].forEach(ev => bubble.addEventListener(ev, cancel));
  });
}

function openCtxMenu(e, sender) {
  closeCtxMenu();
  const point = e.touches ? e.touches[0] : e;
  const overlay = document.createElement('div');
  overlay.className = 'ctx-overlay';
  overlay.id = 'ctx-overlay';
  overlay.addEventListener('click', closeCtxMenu);

  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.id = 'ctx-menu';
  menu.style.left = Math.min(point.clientX, window.innerWidth - 160) + 'px';
  menu.style.top = Math.min(point.clientY, window.innerHeight - 100) + 'px';
  menu.innerHTML = `
    <button id="ctx-block">${escapeHtml(sender)}さんをブロック</button>
    <button id="ctx-ban" class="danger">${escapeHtml(sender)}さんを追放</button>
  `;
  document.body.appendChild(overlay);
  document.body.appendChild(menu);

  document.getElementById('ctx-block').addEventListener('click', () => {
    closeCtxMenu();
    blockUser(sender);
  });
  document.getElementById('ctx-ban').addEventListener('click', () => {
    closeCtxMenu();
    banUser(sender);
  });
}

function closeCtxMenu() {
  const m = document.getElementById('ctx-menu');
  const o = document.getElementById('ctx-overlay');
  if (m) m.remove();
  if (o) o.remove();
}

async function sendSticker(idx) {
  const newId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try {
    const { error } = await sb.from('messages').insert({
      id: newId,
      sender: state.profile.nickname,
      text: STICKER_PREFIX + idx,
      owner_id: DEVICE_ID,
      room: state.room,
    });
    if (error) throw error;
    if (!state.messages.find(m => m.id === newId)) {
      state.messages.push({ id: newId, sender: state.profile.nickname, text: STICKER_PREFIX + idx, time: Date.now(), ownerId: DEVICE_ID, room: state.room });
      renderMessages();
    }
  } catch (e) {
    console.error('スタンプ送信エラー', e);
    const detail = (e && (e.message || e.details || e.hint)) || JSON.stringify(e);
    showToast('スタンプ送信失敗: ' + detail);
  }
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  // 合言葉チェック(判定はSupabase側で行う。コード側には合言葉の手がかりを残さない)
  try {
    const { data: claimedRole, error: claimError } = await sb.rpc('claim_role', {
      p_nickname: state.profile.nickname,
      p_avatar: state.profile.avatar,
      p_passcode: text,
    });
    if (!claimError && claimedRole) {
      const newProfile = { ...state.profile, role: claimedRole };
      state.profile = newProfile;
      localSet('profile', JSON.stringify(newProfile));
      state.profiles[newProfile.nickname] = { avatar: newProfile.avatar, role: claimedRole };
      input.value = '';
      showToast(claimedRole === 'admin' ? '管理人モードになりました' : '副管理人モードになりました');
      updateFooterLinks();
      renderMessages();
      return;
    }
    if (claimError) {
      console.error('合言葉判定エラー', claimError);
      showToast('合言葉の判定でエラー: ' + (claimError.message || JSON.stringify(claimError)));
    }
  } catch (e) {
    console.error('合言葉判定エラー(例外)', e);
    showToast('合言葉の判定でエラー: ' + (e && e.message ? e.message : e));
  }

  const filtered = filterText(text);
  const newId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  input.value = '';
  try {
    const { error } = await sb.from('messages').insert({
      id: newId,
      sender: state.profile.nickname,
      text: filtered.text,
      owner_id: DEVICE_ID,
      room: state.room,
    });
    if (error) throw error;
    if (filtered.flagged) {
      showToast('不適切な可能性がある言葉を一部伏せて送信しました');
    }
    // リアルタイム通知が来る前に自分の画面にはすぐ反映しておく
    if (!state.messages.find(m => m.id === newId)) {
      state.messages.push({ id: newId, sender: state.profile.nickname, text: filtered.text, time: Date.now(), ownerId: DEVICE_ID, room: state.room });
      renderMessages();
    }
  } catch (e) {
    console.error('送信エラー', e);
    const detail = (e && (e.message || e.details || e.hint)) || JSON.stringify(e);
    showToast('送信失敗: ' + detail);
  }
}

async function deleteMessage(id) {
  try {
    await sb.from('messages').delete().eq('id', id).eq('owner_id', DEVICE_ID);
  } catch (e) {}
  state.messages = state.messages.filter(m => !(m.id === id && m.ownerId === DEVICE_ID));
  renderMessages();
}

async function blockUser(name) {
  if (!state.blocked.includes(name)) {
    state.blocked.push(name);
    localSet('blocked', JSON.stringify(state.blocked));
  }
  showToast(`${name}さんをブロックしました`);
  renderMessages();
}

function unblockUser(name) {
  state.blocked = state.blocked.filter(n => n !== name);
  localSet('blocked', JSON.stringify(state.blocked));
  showToast(`${name}さんのブロックを解除しました`);
  renderMessages();
  openBlockedModal(); // リストを再描画
}

function openBlockedModal() {
  const existing = document.getElementById('blocked-modal-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'blocked-modal-overlay';
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
  const card = document.createElement('div');
  card.className = 'modal-card';
  const listHtml = state.blocked.length === 0
    ? '<p class="blocked-empty">ブロックしている相手はいません。</p>'
    : state.blocked.map(name => `
        <div class="blocked-item">
          <span>${escapeHtml(name)}</span>
          <button type="button" data-unblock="${escapeHtml(name)}">解除する</button>
        </div>
      `).join('');
  card.innerHTML = `
    <div class="terms-doc-close"><button type="button" id="blocked-doc-close-btn">閉じる ✕</button></div>
    <div class="terms-doc">
      <h3 class="terms-doc-h1" style="font-size:16px;">ブロック一覧</h3>
      ${listHtml}
    </div>
  `;
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  card.querySelector('#blocked-doc-close-btn').addEventListener('click', () => overlay.remove());
  card.querySelectorAll('[data-unblock]').forEach(btn => {
    btn.addEventListener('click', () => unblockUser(btn.getAttribute('data-unblock')));
  });
}

async function banUser(name) {
  try {
    await sb.from('banned').upsert({ nickname: name });
  } catch (e) {}
  if (!state.banned.includes(name)) state.banned.push(name);
  showToast(`${name}さんを退室させました`);
  renderMessages();
}

const REPORT_HIDE_THRESHOLD = 3;

async function reportMessage(id) {
  const msg = state.messages.find(m => m.id === id);
  if (!msg) return;
  try {
    await sb.from('reports').insert({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      message_id: id,
      reporter: state.profile.nickname,
      sender: msg.sender,
      text: msg.text,
    });

    const { count, error: countError } = await sb
      .from('reports')
      .select('*', { count: 'exact', head: true })
      .eq('message_id', id);

    if (!countError && count !== null && count >= REPORT_HIDE_THRESHOLD) {
      await sb.from('messages').update({ hidden: true }).eq('id', id);
      msg.hidden = true;
      renderMessages();
    }
  } catch (e) {}
  showToast('運営スタッフに通報しました');
}

async function toggleAdmin() {
  state.showAdmin = !state.showAdmin;
  const slot = document.getElementById('admin-slot');
  if (!state.showAdmin) {
    slot.innerHTML = '';
    return;
  }
  let list = [];
  try {
    const { data, error } = await sb.from('reports').select('*').order('created_at', { ascending: false });
    if (!error && data) {
      list = data.map(r => ({ reporter: r.reporter, sender: r.sender, text: r.text }));
    }
  } catch (e) {}
  slot.innerHTML = `
    <div class="admin-panel">
      <h3>通報一覧</h3>
      ${list.length === 0
        ? '<div class="report-item">通報はまだありません。</div>'
        : list.map(r => `
          <div class="report-item">
            <b>${escapeHtml(r.sender)}</b> さんの発言を ${escapeHtml(r.reporter)} さんが通報<br>
            「${escapeHtml(r.text)}」
          </div>
        `).join('')
      }
    </div>
  `;
}

init();
</script>
</body>
